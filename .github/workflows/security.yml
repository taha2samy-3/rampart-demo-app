name: Rampart ASPM Multi-Scanner Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  # ============================================================================
  # 1. SAST Scanning (Semgrep)
  # ============================================================================
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          mkdir -p reports
          semgrep scan --config=auto --sarif --output=reports/semgrep.sarif || true
      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif

  # ============================================================================
  # 2. Secret Detection (Gitleaks & TruffleHog)
  # ============================================================================
  secrets-scans:
    name: Secrets - Gitleaks & TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create reports dir
        run: mkdir -p reports
      - name: Run Gitleaks (JSON & SARIF)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source="/repo" \
            --report-path="/repo/reports/gitleaks.json" \
            --report-format="json" \
            --redact || true
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source="/repo" \
            --report-path="/repo/reports/gitleaks.sarif" \
            --report-format="sarif" \
            --redact || true
      - name: Run TruffleHog (JSON)
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest filesystem /repo --json > reports/trufflehog.json 2>/dev/null || true
      - name: Upload Secrets Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secrets-reports
          path: |
            reports/gitleaks.json
            reports/gitleaks.sarif
            reports/trufflehog.json

  # ============================================================================
  # 3. SCA & IaC (Trivy FS & Config)
  # ============================================================================
  sca-trivy:
    name: SCA & IaC - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reports dir
        run: mkdir -p reports
      - name: Run Trivy vulnerability scanner (FS / Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true
      - name: Run Trivy config scanner (IaC / Dockerfile / K8s)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/trivy-config.sarif'
        continue-on-error: true
      - name: Upload Trivy SARIFs
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            reports/trivy-fs.sarif
            reports/trivy-config.sarif

  # ============================================================================
  # 4. IaC Deep Scan (Checkov)
  # ============================================================================
  iac-checkov:
    name: IaC - Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reports dir
        run: mkdir -p reports
      - name: Run Checkov
        run: |
          docker run --rm -v "$PWD:/work" bridgecrew/checkov:latest \
            -d /work/k8s -f /work/Dockerfile --output sarif --output-file-path /work/reports/checkov.sarif || true
      - name: Upload Checkov SARIF
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: reports/checkov.sarif

  # ============================================================================
  # 5. SBOM Generation & Vulnerability Scan (Syft & Grype) + OpenVEX
  # ============================================================================
  sbom-and-grype:
    name: SBOM & Vulnerabilities - Syft, Grype & OpenVEX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Generate SBOM (CycloneDX) with Syft
        uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/sbom.cyclonedx.json
      - name: Generate SBOM (SPDX JSON) with Syft
        uses: anchore/sbom-action/download-syft@v0.17.9
      - name: Syft SPDX export
        run: |
          syft dir:. -o spdx-json=reports/sbom.spdx.json
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v5
        with:
          sbom: reports/sbom.cyclonedx.json
          format: sarif
          output-file: reports/grype.sarif
        continue-on-error: true
      - name: Include OpenVEX Document
        run: |
          if [ -f vex/openvex.json ]; then
            cp vex/openvex.json reports/openvex.json
          fi
      - name: Upload SBOM & Grype artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-grype-reports
          path: |
            reports/sbom.cyclonedx.json
            reports/sbom.spdx.json
            reports/grype.sarif
            reports/openvex.json

  # ============================================================================
  # 6. Container Image Build & Trivy Image Scan
  # ============================================================================
  container-scan:
    name: Container - Build & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reports dir
        run: mkdir -p reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local container image
        run: |
          docker build -t rampart-demo-app:test .
      - name: Run Trivy on container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rampart-demo-app:test'
          format: 'sarif'
          output: 'reports/trivy-image.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true
      - name: Upload Container SARIF
        uses: actions/upload-artifact@v4
        with:
          name: container-sarif
          path: reports/trivy-image.sarif

  # ============================================================================
  # 7. Aggregate All Reports into Single Bundle for Rampart
  # ============================================================================
  bundle-reports:
    name: Aggregate & Bundle All Security Reports
    needs: [sast-semgrep, secrets-scans, sca-trivy, iac-checkov, sbom-and-grype, container-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Create aggregate directory
        run: mkdir -p all-reports
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten reports
        run: |
          find artifacts -type f \( -name "*.sarif" -o -name "*.json" \) -exec cp {} all-reports/ \;
          ls -la all-reports
      - name: Upload Unified Rampart Reports Bundle
        uses: actions/upload-artifact@v4
        with:
          name: rampart-security-reports
          path: all-reports/

      # Optional direct upload if Rampart credentials exist in GitHub Secrets
      - name: Upload to Rampart ASPM (if configured)
        if: env.RAMPART_SERVER != '' && env.RAMPART_TOKEN != ''
        env:
          RAMPART_SERVER: ${{ secrets.RAMPART_SERVER }}
          RAMPART_TOKEN: ${{ secrets.RAMPART_TOKEN }}
        run: |
          ./scripts/upload-to-rampart.sh all-reports
