apiVersion: apps/v1
kind: Deployment
metadata:
  name: rampart-demo-app
  labels:
    app: rampart-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rampart-demo-app
  template:
    metadata:
      labels:
        app: rampart-demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/taha2samy-3/rampart-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rampart-demo-app
spec:
  type: ClusterIP
  selector:
    app: rampart-demo-app
  ports:
    - port: 80
      targetPort: 3000
      name: http
